<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>QR Code Generator - DocuNest</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
header{background:#101827;color:white;text-align:center;padding:22px}
header a{color:#c5d3e8;text-decoration:none;font-size:14px}
main{max-width:650px;margin:30px auto;padding:15px}
.card{background:white;padding:24px;border-radius:16px;box-shadow:0 5px 20px #17203312}
h2{margin-bottom:10px}
p{color:#657087;line-height:1.5}
textarea{width:100%;height:110px;padding:13px;border:1px solid #ccd5e2;border-radius:10px;font-size:16px;margin:18px 0;resize:vertical}
button{border:0;background:#2563eb;color:white;padding:13px 18px;border-radius:9px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
#result{text-align:center;margin-top:25px}
#qrcode{display:inline-block;padding:15px;background:white;border:1px solid #e1e6ef;border-radius:12px;min-height:20px}
#qrcode img{max-width:100%;height:auto}
#download{margin-top:18px;display:none}
.status{margin-top:14px;color:#dc2626}
</style>
</head>

<body>

<header>
<h1>DocuNest</h1>
<p style="color:#c5d3e8">QR Code Generator</p>
<a href="index.html">← Back to Homepage</a>
</header>

<main>
<div class="card">
<h2>Create a QR Code</h2>
<p>Enter a website link or any text to generate your QR code.</p>

<textarea id="textInput" placeholder="Enter website URL or text here..."></textarea>

<button id="generateBtn">Generate QR Code</button>

<div id="result">
<div id="qrcode"></div>
<br>
<button id="download" disabled>Download PNG</button>
</div>

<div class="status" id="status"></div>

<p style="font-size:13px;margin-top:20px">
Your text is processed in your browser. It is not uploaded to a server.
</p>
</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
const textInput = document.getElementById("textInput");
const generateBtn = document.getElementById("generateBtn");
const downloadBtn = document.getElementById("download");
const qrContainer = document.getElementById("qrcode");
const statusBox = document.getElementById("status");

let qrCode = null;

generateBtn.addEventListener("click", function(){

    const text = textInput.value.trim();

    if(!text){
        statusBox.textContent = "Please enter some text or a website link.";
        return;
    }

    if(typeof QRCode === "undefined"){
        statusBox.textContent = "QR generator failed to load. Check your internet connection.";
        return;
    }

    qrContainer.innerHTML = "";
    statusBox.textContent = "";
    downloadBtn.style.display = "none";

    qrCode = new QRCode(qrContainer, {
        text: text,
        width: 256,
        height: 256,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
    });

    setTimeout(function(){
        const canvas = qrContainer.querySelector("canvas");

        if(canvas){
            downloadBtn.disabled = false;
            downloadBtn.style.display = "inline-block";
        }else{
            statusBox.textContent = "Could not generate the QR code. Try shorter text.";
        }
    }, 300);
});

downloadBtn.addEventListener("click", function(){

    const canvas = qrContainer.querySelector("canvas");

    if(!canvas) return;

    const link = document.createElement("a");
    link.download = "docunest-qr-code.png";
    link.href = canvas.toDataURL("image/png");
    link.click();

});
</script>

</body>
</html>
